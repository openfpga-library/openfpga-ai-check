[package]
name = "openfpga-ai-check"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.23.0"
candle-core = "0.11.0"
candle-transformers = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
hf-hub = "1.0.0"
icu = { version = "2.2.0", features = ["compiled_data"] }
octocrab = "0.54.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.1"
tokio = { version = "1.53.1", features = ["full"] }
